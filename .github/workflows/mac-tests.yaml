name: mac-tests
on: [push, pull_request]
permissions: {}
jobs:
  ci_tests_mac:
    runs-on: macos-26
    name: macOS CI Tests
    env:
      TZ: America/Los_Angeles
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: configure Environment
      run: |
        echo "PATH=$HOME/gnucash/inst/bin:$PATH" >> $GITHUB_ENV
        echo "PREFIX=$HOME/gnucash/inst" >> $GITHUB_ENV
        echo "SRCROOT=$HOME/gnucash/source" >> $GITHUB_ENV
        brew install ninja
    - name: Verify dependency archive override
      env:
        DEPENDENCIES_URL: ${{ vars.MACOS_DEPENDENCIES_URL }}
        DEPENDENCIES_SHA256: ${{ vars.MACOS_DEPENDENCIES_SHA256 }}
      run: |
        if [ -n "$DEPENDENCIES_URL" ] || [ -n "$DEPENDENCIES_SHA256" ]; then
          if [[ "$DEPENDENCIES_URL" != https://* ]] ||
             [[ ! "$DEPENDENCIES_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo 'Set both MACOS_DEPENDENCIES_URL (HTTPS) and MACOS_DEPENDENCIES_SHA256.' >&2
            exit 1
          fi
        fi
    - name: download dependency tarball
      uses: carlosperate/download-file-action@v2
      id: dependencies
      with:
        file-url: ${{ vars.MACOS_DEPENDENCIES_URL || 'https://downloads.sourceforge.net/gnucash/Dependencies/gnucash-future-mac-dependencies.tar.xz' }}
        file-name: gnucash-future-mac-dependencies.tar.xz
        sha256: ${{ vars.MACOS_DEPENDENCIES_SHA256 || 'dbcecf47b368eee317d18e2ad547b754329c17075420aaecddaf99f9d53b6c7b' }}
    - name: download googletest
      uses: carlosperate/download-file-action@v2

      id: googletest
      with:
        file-url: 'https://github.com/google/googletest/releases/download/v1.17.0/googletest-1.17.0.tar.gz'
        file-name: googletest-1.17.0.tar.gz
        sha256: '65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c'
    - name: Extract Dependencies
      run: |
        mkdir -p $HOME/gnucash/inst
        cd $HOME/gnucash/inst
        tar -xf $GITHUB_WORKSPACE/gnucash-future-mac-dependencies.tar.xz
        mkdir $HOME/gnucash/source
        cd $HOME/gnucash/source
        tar -xf $GITHUB_WORKSPACE/googletest-1.17.0.tar.gz
        mv googletest-* googletest
    - name: Verify dependency archive
      run: |
        "$PREFIX/bin/pkgconf" --exists \
          'gtk4 >= 4.14' \
          gtk4-macos \
          gwengui-gtk4 \
          aqbanking
    - name: Configure GnuCash
      run: |
        mkdir $HOME/gnucash/build
        cd $HOME/gnucash/build
        cmake -GNinja -DPKG_CONFIG_EXECUTABLE=$PREFIX/bin/pkgconf -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DWITH_PYTHON=ON -DGTEST_ROOT=$SRCROOT/googletest $GITHUB_WORKSPACE
    - name: Validate GTK4 builder resources
      run: bash "$GITHUB_WORKSPACE/util/ci/validate-gtk4-builder-resources.sh" "$GITHUB_WORKSPACE/gnucash"
    - name: Build and Test GnuCash
      run: |
        cd $HOME/gnucash/build
        ninja
        ninja check
      env:
        CTEST_OUTPUT_ON_FAILURE: On
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: TestLog
        path: /Users/runner/gnucash/build/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
