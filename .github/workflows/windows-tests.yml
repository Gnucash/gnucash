name: windows-tests
on: [push, pull_request, workflow_dispatch]
permissions: {}
jobs:
    ci_tests_ucrt64:
        runs-on: windows-latest
        name: Windows ucrt64 CI Tests
        env:
          TZ: America/Los_Angeles
        defaults:
          run:
            shell: msys2 {0}
        steps:
        - name: Setup
          uses: msys2/setup-msys2@v2
          with:
            msystem: UCRT64
            update: true
            install: git
            pacboy: toolchain:p cmake:p ninja:p

        - name: Add our repo
          shell: msys2 {0}
          run: |
            sed -i "/^# SigLevel = Never/a [gnc-ucrt64]\nSigLevel = Optional TrustAll\nServer = https://github.com/gnucash/gnucash-windows-deps-repo/releases/download/gnc-ucrt64-repo/" /etc/pacman.conf
            sed -i "s/^# ParallelDownloads/ParallelDownloads/" /etc/pacman.conf

            pacman -Syv
            pacboy --noconfirm -S swig:p appstream-glib:p aqbanking:p boost:p docbook-xsl:p gettext-tools:p gtest:p guile3:p icu:p pdcurses:p libdbi-drivers:p libofx:p webview2-loader zlib:p
            ls -l $MSYSTEM_PREFIX/lib/dbd

        - name: Checkout
          uses: actions/checkout@v7
        - name: Configure
          shell: msys2 {0}
          env:
            GUILE_LOAD_PATH: "${{ env.MSYSTEM_PREFIX }}/share/guile/3.0/"
            GUILE_LOAD_COMPILED_PATH: "${{ env.MSYSTEM_PREFIX }}/lib/guile/3.0/ccache"
          run: |
            mkdir build && cd build
            cmake -G Ninja ..
        - name: Build and Test GnuCash
          env:
            GUILE_LOAD_PATH: "${{ env.MSYSTEM_PREFIX }}/share/guile/3.0/"
            GUILE_LOAD_COMPILED_PATH: "${{ env.MSYSTEM_PREFIX }}/lib/guile/3.0/ccache"
            CTEST_OUTPUT_ON_FAILURE: On
          run: |
            cd build
            ninja
            ninja check

        - uses: actions/upload-artifact@v7
          if: failure()
          with:
            name: TestResults
            path: |
              build/Testing/Temporary/LastTest.log
